name: SPHERE DEV CI and Offline Release

on:
  push:
    branches: [rundeck-sphere-dev]
    # Documentation-only commits do not need a full browser/build/package run.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Cancel outdated push builds; keep manual offline-release runs independent.
concurrency:
  group: sphere-dev-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Full QA and offline release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run static checks, cockpit regression, and build
        run: npm run qa
      - name: Boot built DEV app in Chromium and reject blank dashboard
        run: bash scripts/qa-browser-boot.sh
      - name: Verify full-width APP evaluation geometry in Chromium
        run: node scripts/qa-evaluation-layout.mjs
      - name: Render and validate monthly SAP ABAP PDF (long programs, errors and page breaks)
        run: |
          node scripts/qa-monthly-pdf.mjs
          if command -v pdfinfo >/dev/null; then pdfinfo "$RUNNER_TEMP/sphere-monthly-qa-fixture.pdf" | grep -E 'Pages:|Page size:'; fi
          if command -v pdftotext >/dev/null; then
            pdftotext -layout "$RUNNER_TEMP/sphere-monthly-qa-fixture.pdf" "$RUNNER_TEMP/sphere-monthly-qa-fixture.txt"
            grep -q 'ZLAST_CANDIDATE_10' "$RUNNER_TEMP/sphere-monthly-qa-fixture.txt"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Linux x86_64 wheels for offline deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/sphere-wheels"
          python -m pip download --only-binary=:all: \
            -r backend/requirements.txt -d "$RUNNER_TEMP/sphere-wheels"
      - name: Backend unit tests with offline wheels
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --no-index --find-links "$RUNNER_TEMP/sphere-wheels" \
            -r backend/requirements.txt
          python -m unittest \
            backend.tests.test_rundeck_evaluation_v1194 \
            backend.tests.test_rundeck_evaluation_paging_dev \
            backend.tests.test_rundeck_custom_window \
            backend.tests.test_rundeck_network_trends \
            backend.tests.test_rundeck_monthly_review
      - name: Validate Windows PowerShell deployment bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'ops/rundeck/push-dev-offline.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell bootstrap has syntax errors'
          }
      - name: Prepare verified DEV offline release artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "rundeck-sphere-dev"
          test -f dist/index.html
          grep -q '/dev/assets/' dist/index.html
          grep -Rqs "${GITHUB_SHA:0:7}" dist/assets
          STAGE="$RUNNER_TEMP/sphere-offline-release"
          mkdir -p "$STAGE/wheels"
          test "$(git branch --show-current)" = rundeck-sphere-dev
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git bundle create "$STAGE/source.bundle" refs/heads/rundeck-sphere-dev
          git bundle verify "$STAGE/source.bundle"
          tar -czf "$STAGE/web-dist.tar.gz" -C dist .
          cp "$RUNNER_TEMP"/sphere-wheels/*.whl "$STAGE/wheels/"
          cp ops/rundeck/release-dev-offline.sh "$STAGE/release-dev-offline.sh"
          printf '%s\n' "$GITHUB_SHA" > "$STAGE/source.sha"
          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS -print0 |
              LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -czf "sphere-dev-$GITHUB_SHA.tar.gz" -C "$STAGE" .
          sha256sum "sphere-dev-$GITHUB_SHA.tar.gz" > "sphere-dev-$GITHUB_SHA.tar.gz.sha256"
      - name: Upload offline DEV release (only after complete QA)
        uses: actions/upload-artifact@v4
        with:
          name: sphere-dev-${{ github.sha }}
          path: |
            sphere-dev-${{ github.sha }}.tar.gz
            sphere-dev-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
