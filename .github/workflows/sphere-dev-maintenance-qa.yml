name: SPHERE DEV maintenance parity QA

on:
  pull_request:
    branches: [rundeck-sphere-dev, perf/dev-report-split-distinct-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sphere-dev-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Full frontend QA and Vite build
        run: npm run qa
      - name: Browser boot and Monitoring layout parity
        run: |
          bash scripts/qa-browser-boot.sh
          node scripts/qa-six-chart-monitoring.mjs
      - name: Monthly Management PDF regression and 16:9 raster check
        run: |
          node scripts/qa-monthly-pdf.mjs
          if command -v pdfinfo >/dev/null; then
            pdfinfo "$RUNNER_TEMP/sphere-monthly-management-qa.pdf" | grep -q 'Pages:[[:space:]]*1'
            pdfinfo "$RUNNER_TEMP/sphere-monthly-management-qa.pdf" | grep -q 'Page size:[[:space:]]*960 x 540 pts'
          fi
          if command -v pdftoppm >/dev/null; then
            pdftoppm -f 1 -l 1 -singlefile -r 144 -png \
              "$RUNNER_TEMP/sphere-monthly-management-qa.pdf" \
              "$RUNNER_TEMP/sphere-monthly-16x9-preview"
            python -c 'import struct,sys; raw=open(sys.argv[1],"rb").read(24); assert raw[:8]==bytes([137,80,78,71,13,10,26,10]); assert struct.unpack(">II",raw[16:24])==(1920,1080)' \
              "$RUNNER_TEMP/sphere-monthly-16x9-preview.png"
          fi
      - name: Require PDF raster tools for A3 visual QA
        run: |
          set -Eeuo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
      - name: Verify A3 landscape SAP Availability and render one-page evidence
        run: |
          set -Eeuo pipefail
          test -s "$RUNNER_TEMP/sphere-monthly-management-a3-qa.pdf"
          pdfinfo "$RUNNER_TEMP/sphere-monthly-management-a3-qa.pdf" | grep -q 'Pages:[[:space:]]*1'
          pdfinfo "$RUNNER_TEMP/sphere-monthly-management-a3-qa.pdf" | grep -q 'Page size:[[:space:]]*1190.55 x 841.89 pts'
          pdftotext -layout "$RUNNER_TEMP/sphere-monthly-management-a3-qa.pdf" "$RUNNER_TEMP/sphere-monthly-a3-evidence.txt"
          grep -q 'SAP Availability' "$RUNNER_TEMP/sphere-monthly-a3-evidence.txt"
          grep -q 'APP1' "$RUNNER_TEMP/sphere-monthly-a3-evidence.txt"
          grep -q 'APP5' "$RUNNER_TEMP/sphere-monthly-a3-evidence.txt"
          grep -q 'Observed Service Checks' "$RUNNER_TEMP/sphere-monthly-a3-evidence.txt"
          pdftoppm -f 1 -l 1 -singlefile -r 110 -png \
            "$RUNNER_TEMP/sphere-monthly-management-a3-qa.pdf" \
            "$RUNNER_TEMP/sphere-monthly-a3-preview"
          test -s "$RUNNER_TEMP/sphere-monthly-a3-preview.png"
      - name: Upload A3 availability visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sphere-monthly-a3-availability-qa
          path: |
            ${{ runner.temp }}/sphere-monthly-management-a3-qa.pdf
            ${{ runner.temp }}/sphere-monthly-a3-preview.png
          retention-days: 3
          if-no-files-found: error
      - name: Upload 16:9 management visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sphere-monthly-management-16x9-qa
          path: |
            ${{ runner.temp }}/sphere-monthly-management-qa.pdf
            ${{ runner.temp }}/sphere-monthly-16x9-preview.png
          retention-days: 3
          if-no-files-found: error
      - name: Weekly 16:9 cross-month PDF geometry and raster QA
        run: |
          node scripts/qa-weekly-slide.mjs
          if command -v pdfinfo >/dev/null; then
            pdfinfo "$RUNNER_TEMP/sphere-weekly-management-16x9-qa.pdf" | grep -q 'Pages:[[:space:]]*1'
            pdfinfo "$RUNNER_TEMP/sphere-weekly-management-16x9-qa.pdf" | grep -q 'Page size:[[:space:]]*960 x 540 pts'
          fi
          if command -v pdftoppm >/dev/null; then
            pdftoppm -f 1 -l 1 -singlefile -r 144 -png \
              "$RUNNER_TEMP/sphere-weekly-management-16x9-qa.pdf" \
              "$RUNNER_TEMP/sphere-weekly-16x9-preview"
            python -c 'import struct,sys; raw=open(sys.argv[1],"rb").read(24); assert raw[:8]==bytes([137,80,78,71,13,10,26,10]); assert struct.unpack(">II",raw[16:24])==(1920,1080)' \
              "$RUNNER_TEMP/sphere-weekly-16x9-preview.png"
          fi
      - name: Upload Weekly 16:9 visual regression artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sphere-weekly-management-16x9-qa
          path: |
            ${{ runner.temp }}/sphere-weekly-management-16x9-qa.pdf
            ${{ runner.temp }}/sphere-weekly-16x9-preview.png
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend monthly-storage and monthly-report regression
        run: |
          python -m compileall -q backend
          python -m unittest -v \
            backend.tests.test_rundeck_infra \
            backend.tests.test_rundeck_monthly_review \
            backend.tests.test_report_ready_source_pruning \
            backend.tests.test_report_collection_date_plan \
            backend.tests.test_report_actual_profile_dev \
            backend.tests.test_report_workload_window_pruning \
            backend.tests.test_report_pressure_sql_plan \
            backend.tests.test_rundeck_weekly_report \
            backend.tests.test_rundeck_availability_report_window \
            backend.tests.test_rundeck_availability_coverage \
            backend.tests.test_rundeck_workload_activity \
            backend.tests.test_rundeck_top_consumers
