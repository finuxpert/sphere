name: SPHERE DEV report split-distinct PostgreSQL parity

on:
  pull_request:
    branches: [rundeck-sphere-dev, perf/dev-report-split-distinct-20261105]
    paths:
      - backend/rundeck_evaluation.py
      - backend/tests/test_report_split_distinct_dev.py
      - backend/tests/test_report_split_distinct_runtime_dev.py
      - ops/rundeck/compare-report-split-distinct-dev.py
      - .github/workflows/sphere-report-split-distinct-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sphere_parity_ci
          POSTGRES_USER: sphere_ci
          POSTGRES_PASSWORD: sphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sphere_ci -d sphere_parity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile backend/rundeck_evaluation.py
          python -m py_compile backend/tests/test_report_split_distinct_dev.py
          python -m py_compile backend/tests/test_report_split_distinct_runtime_dev.py
          python -m py_compile ops/rundeck/compare-report-split-distinct-dev.py
      - name: PostgreSQL aggregate field parity and legacy fixtures
        env:
          SPHERE_PG_PARITY_URL: postgresql+psycopg://sphere_ci:sphere_ci@localhost:5432/sphere_parity_ci
        run: |
          python -m unittest -v             backend.tests.test_report_split_distinct_runtime_dev             backend.tests.test_report_split_distinct_dev             backend.tests.test_report_ready_source_pruning             backend.tests.test_report_workload_window_pruning             backend.tests.test_report_actual_profile_dev
